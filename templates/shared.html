<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% if title %}{{ title }}{% else %}Shared App{% endif %} — RouteMind</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: sans-serif; height: 100vh; display: flex; flex-direction: column; background: #0d1220; }
  .bar { padding: 12px 20px; background: #111827; color: #e6ebf5; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1f2b3e; }
  .bar span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 60vw; }
  .bar a { color: #60a5fa; text-decoration: none; font-size: 14px; flex-shrink: 0; margin-left: 12px; }
  iframe { flex: 1; border: none; width: 100%; }
</style>
</head>
<body>
  <div class="bar">
    <span id="bar-title" data-has-title="{{ '1' if title else '0' }}">
      {% if title %}{{ title }}{% else %}Shared App{% endif %}
    </span>
    <a href="/builder" id="bar-cta"
       data-en="Build your own →"
       data-zh="我也要做一个 →">Build your own →</a>
  </div>
  <iframe id="shared-frame" sandbox="allow-scripts allow-forms allow-modals"></iframe>

  <script id="app-payload" type="application/json">{{ code | tojson }}</script>

  <script>
    (function () {
      var lang = (navigator.language || "en").toLowerCase().indexOf("zh") === 0 ? "zh" : "en";
      document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";

      var cta = document.getElementById("bar-cta");
      if (cta) {
        var v = cta.getAttribute("data-" + lang);
        if (v) cta.textContent = v;
      }

      var bar = document.getElementById("bar-title");
      var titleEl = document.querySelector("title");
      if (bar && bar.dataset.hasTitle === "0") {
        var fallback = lang === "zh" ? "分享的应用" : "Shared App";
        bar.textContent = fallback;
        if (titleEl) titleEl.textContent = fallback + " — RouteMind";
      }

      var html;
      try {
        var payloadEl = document.getElementById("app-payload");
        html = JSON.parse(payloadEl.textContent);
      } catch (e) {
        document.getElementById("shared-frame").srcdoc =
          '<body style="font-family:sans-serif;padding:40px;color:#f87171;">' +
          'Failed to load shared app: ' + (e && e.message ? e.message : "parse error") +
          '</body>';
        return;
      }
      if (typeof html !== "string") {
        document.getElementById("shared-frame").srcdoc =
          '<body style="font-family:sans-serif;padding:40px;color:#f87171;">Invalid payload</body>';
        return;
      }

      var polyfill = '<script>(function(){' +
        'var store = {};' +
        'var fake = {' +
        'getItem: function(k){return Object.prototype.hasOwnProperty.call(store,k)?String(store[k]):null;},' +
        'setItem: function(k,v){store[k]=String(v);},' +
        'removeItem: function(k){delete store[k];},' +
        'clear: function(){store={};},' +
        'key: function(i){var ks=Object.keys(store);return i<ks.length?ks[i]:null;}' +
        '};' +
        'try{Object.defineProperty(fake,"length",{get:function(){return Object.keys(store).length;}});}catch(e){}' +
        'try{Object.defineProperty(window,"localStorage",{configurable:true,value:fake});}catch(e){try{window.localStorage=fake;}catch(e2){}}' +
        'try{Object.defineProperty(window,"sessionStorage",{configurable:true,value:fake});}catch(e){try{window.sessionStorage=fake;}catch(e2){}}' +
        '})();<\/script>';

      if (/<head[^>]*>/i.test(html)) {
        html = html.replace(/<head[^>]*>/i, function (m) { return m + polyfill; });
      } else if (/<html[^>]*>/i.test(html)) {
        html = html.replace(/<html[^>]*>/i, function (m) { return m + polyfill; });
      } else {
        html = polyfill + html;
      }

      document.getElementById("shared-frame").srcdoc = html;
    })();
  </script>
</body>
</html>
